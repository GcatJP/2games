  <body>
    <h1 class="page-title">Unit 19：Time And Date</h1>
    <a class="back-btn" href="index.html">← Back</a>
    <div id="app"></div>

    <script>
      /* ---------------- Unit 19 data: time and date ---------------- */
      // No image files needed: days, months and times are shown as text.

      const NUMBER_ONES = [
        "zero",
        "one",
        "two",
        "three",
        "four",
        "five",
        "six",
        "seven",
        "eight",
        "nine",
        "ten",
        "eleven",
        "twelve",
        "thirteen",
        "fourteen",
        "fifteen",
        "sixteen",
        "seventeen",
        "eighteen",
        "nineteen",
      ];
      const NUMBER_TENS = [
        "",
        "",
        "twenty",
        "thirty",
        "forty",
        "fifty",
        "sixty",
        "seventy",
        "eighty",
        "ninety",
      ];
      function numberToWords(n) {
        if (n === 100) return "one hundred";
        if (n < 20) return NUMBER_ONES[n];
        const tens = Math.floor(n / 10),
          ones = n % 10;
        return NUMBER_TENS[tens] + (ones ? "-" + NUMBER_ONES[ones] : "");
      }

      // "7:20" -> "seven twenty"   "5:05" -> "five oh five"   "6:00" -> "six o'clock"
      function timeToWords(h, m) {
        const hourWord = numberToWords(h);
        if (m === 0) return `${hourWord} o'clock`;
        const minWord = m < 10 ? `oh ${numberToWords(m)}` : numberToWords(m);
        return `${hourWord} ${minWord}`;
      }
      function pad2(n) {
        return n < 10 ? `0${n}` : String(n);
      }

      const DAY_NAMES = [
        "Sunday",
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday",
      ];
      const DAY_ABBR = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
      const DAYS = DAY_NAMES.map((d, i) => ({ text: DAY_ABBR[i], word: d }));

      const MONTH_NAMES = [
        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December",
      ];
      const MONTH_ABBR = [
        "JAN",
        "FEB",
        "MAR",
        "APR",
        "MAY",
        "JUN",
        "JUL",
        "AUG",
        "SEP",
        "OCT",
        "NOV",
        "DEC",
      ];
      const MONTHS = MONTH_NAMES.map((m, i) => ({
        text: MONTH_ABBR[i],
        word: m,
      }));

      // the exact times from the textbook's "Let's say" list
      const TIMES = [
        { h: 1, m: 0 },
        { h: 7, m: 20 },
        { h: 12, m: 10 },
        { h: 3, m: 30 },
        { h: 6, m: 0 },
        { h: 5, m: 5 },
        { h: 2, m: 40 },
        { h: 9, m: 1 },
        { h: 10, m: 55 },
        { h: 4, m: 15 },
      ].map((t) => ({
        text: `${t.h}:${pad2(t.m)}`,
        word: timeToWords(t.h, t.m),
      }));

      /* ---------------- helpers ---------------- */
      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function sample(arr, n) {
        return shuffle(arr).slice(0, n);
      }

      function speakText(text) {
        if (!("speechSynthesis" in window)) return;
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = "en-US";
        utter.rate = 0.85;
        window.speechSynthesis.speak(utter);
      }
      function speakPattern(el) {
        const lines = [...el.querySelectorAll(".line")].map((line) => {
          const clone = line.cloneNode(true);
          clone.querySelector(".jp-sub")?.remove();
          return clone.textContent.trim();
        });
        speakText(lines.join(". "));
      }
      /* ---- audio ---- */
      let audioCtx = null;
      function getCtx() {
        if (!audioCtx)
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        return audioCtx;
      }
      function playTone(freq, startTime, duration, gainPeak) {
        const ctx = getCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(ctx.destination);
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(gainPeak, startTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
        osc.start(startTime);
        osc.stop(startTime + duration + 0.02);
      }
      function playCorrectJingle() {
        const ctx = getCtx(),
          now = ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) =>
          playTone(f, now + i * 0.09, 0.22, 0.22),
        );
      }
      function playWrongSound() {
        const ctx = getCtx(),
          now = ctx.currentTime;
        playTone(220, now, 0.18, 0.12);
        playTone(196, now + 0.08, 0.18, 0.1);
      }
      function playWinFanfare() {
        const ctx = getCtx(),
          now = ctx.currentTime;
        [523.25, 523.25, 659.25, 783.99, 1046.5, 1318.51].forEach((f, i) =>
          playTone(f, now + [0, 0.15, 0.3, 0.45, 0.6, 0.8][i], 0.3, 0.22),
        );
      }
      /* ---------------- build question banks (per session, so they re-shuffle every visit) ---------------- */
      function buildQuiz(bank, size, sentence) {
        return sample(bank, size).map((item) => {
          const distractors = sample(
            bank.filter((x) => x.word !== item.word),
            3,
          );
          const options = shuffle([item, ...distractors]);
          return {
            text: item.text,
            options: options.map((o) => sentence(o.word)),
            correctFull: sentence(item.word),
          };
        });
      }

      function buildDaysQuiz() {
        return buildQuiz(DAYS, 6, (w) => `It's ${w}.`);
      }
      function buildMonthsQuiz() {
        return buildQuiz(MONTHS, 6, (w) => `It's ${w}.`);
      }
      function buildTimeQuiz() {
        return buildQuiz(TIMES, 6, (w) => `It's ${w}.`);
      }

      /* ---------------- state ---------------- */
      let state = {
        screen: "intro",
        quizIndex: 0,
        qIndex: 0,
        score: 0,
        totalScore: 0,
        totalQuestions: 0,
        banks: [],
      };

      const QUIZ_META = [
        {
          key: "days",
          label: "Quiz １： Days",
          build: buildDaysQuiz,
        },
        {
          key: "months",
          label: "Quiz 2 ： Months",
          build: buildMonthsQuiz,
        },
        {
          key: "time",
          label: "Quiz 3 ： Time",
          build: buildTimeQuiz,
        },
      ];

      function resetAll() {
        state = {
          screen: "intro",
          quizIndex: 0,
          qIndex: 0,
          score: 0,
          totalScore: 0,
          totalQuestions: 0,
          banks: QUIZ_META.map((m) => m.build()),
        };
      }

      /* ---------------- render ---------------- */
      const app = document.getElementById("app");

      function render() {
        if (state.screen === "intro") return renderIntro();
        if (state.screen === "quiz") return renderQuiz();
        if (state.screen === "quizDone") return renderQuizDone();
        if (state.screen === "final") return renderFinal();
      }

      function wordGrid(items) {
        return items
          .map(
            (item) => `
               <div class="letter-card" data-say="${item.word}">
                  <div class="letter-big word-tile">${item.word}</div>
                </div>`,
          )
          .join("");
      }

      function timeList() {
        return TIMES.map(
          (t) => `
               <div class="phrase-card" data-say="${t.word}">
                  <div class="phrase-emoji">🕐</div>
                  <div>
                    <div class="phrase-en">${t.text}</div>
                    <div class="phrase-jp">${t.word}</div>
                  </div>
                </div>`,
        ).join("");
      }

      function renderIntro() {
        app.innerHTML = `

                <h2 class="section-title">ようびの べんきょう</h2>
                <p class="jp">
                  １しゅうかんの <span class="en">days（ようび）</span> です。<br>
                  カードを タップすると、はつおんが きこえるよ！ 🔊
                </p>
                <div class="letter-grid days-grid">${wordGrid(DAYS)}</div>

                <div class="pattern-box">
                  <p class="jp" style="margin-bottom:10px;">
                    「なんようびですか？」と きくときは、こう いいます。
                  </p>
                  <div class="line">
                    "What day is it?"
                    <span class="jp-sub">→ きょうは なんようびですか？</span>
                  </div>
                  <div class="line">
                    "It's Monday."
                    <span class="jp-sub">→ げつようび です。</span>
                  </div>
                </div>

                <h2 class="section-title">つきの べんきょう</h2>
                <p class="jp">
                  １ねんの <span class="en">months（つき）</span> です。
                </p>
                <div class="letter-grid months-grid">${wordGrid(MONTHS)}</div>

                <div class="pattern-box">
                  <p class="jp" style="margin-bottom:10px;">
                    「にちじ」を いうときは、こう いいます。
                  </p>
                  <div class="line">
                    "What's the date?"
                    <span class="jp-sub">→ きょうは なんにち ですか？</span>
                  </div>
                  <div class="line">
                    "It's January 1st."
                    <span class="jp-sub">→ １がつ ついたち です。</span>
                  </div>
                  <div class="line">
                    "When is your birthday?"
                    <span class="jp-sub">→ たんじょうびは いつ ですか？</span>
                  </div>
                  <div class="line">
                    "It's on May 3rd."
                    <span class="jp-sub">→ ５がつ ３にち です。</span>
                  </div>
                </div>

                <div class="note-box">
                  <p class="jp">
                    💡 ひづけは <span class="en">1st, 2nd, 3rd, 4th...</span> のように
                    いいます。<span class="en">on</span> を つけて
                    <span class="en">"It's on May 3rd."</span> とも いえます。
                  </p>
                </div>

                <h2 class="section-title">じかんの べんきょう</h2>
                <p class="jp">
                  <span class="en">time（じかん）</span> の いいかたです。
                  タップして きいて みよう！
                </p>
                <div class="phrase-list">${timeList()}</div>

                <div class="pattern-box">
                  <p class="jp" style="margin-bottom:10px;">
                    「いま なんじ ですか？」と きくときは、こう いいます。
                  </p>
                  <div class="line">
                    "What time is it?"
                    <span class="jp-sub">→ いま なんじ ですか？</span>
                  </div>
                  <div class="line">
                    "It's five o'clock."
                    <span class="jp-sub">→ ５じ です。</span>
                  </div>
                </div>

                <p class="jp">
                  じゅんびは いいですか？ さいごに ３つの クイズに ちょうせんしましょう！
                </p>

                <div class="btn-row">
                  <button class="btn btn-primary" id="startBtn">クイズを はじめる</button>
                </div>
              `;
        document.getElementById("startBtn").onclick = () => {
          state.screen = "quiz";
          state.quizIndex = 0;
          state.qIndex = 0;
          state.score = 0;
          render();
        };
        document.querySelectorAll(".letter-card").forEach((card) => {
          card.style.cursor = "pointer";
          card.addEventListener("click", () => speakText(card.dataset.say));
        });
        document.querySelectorAll(".phrase-card").forEach((card) => {
          card.addEventListener("click", () => speakText(card.dataset.say));
        });
        document.querySelectorAll(".pattern-box").forEach((box) => {
          box.style.cursor = "pointer";
          box.addEventListener("click", () => speakPattern(box));
        });
      }
      function currentBank() {
        return state.banks[state.quizIndex];
      }

      function renderQuiz() {
        const meta = QUIZ_META[state.quizIndex];
        const bank = currentBank();
        const q = bank[state.qIndex];

        const bodyHtml = `
                  <div class="quiz-icon"><span class="text-tile">${q.text}</span></div>
                    <p class="question-jp spaced">Choose the correct sentence.</p>
                  <div class="options single" id="optionsWrap">
                    ${q.options
                      .map(
                        (opt) =>
                          `<button class="opt-btn" data-correct="${opt === q.correctFull}">${opt}</button>`,
                      )
                      .join("")}
                  </div>
                `;

        app.innerHTML = `
                <span class="quiz-label">${meta.label}</span>
               <div class="progress">Question ${state.qIndex + 1} / ${bank.length}</div>
                ${bodyHtml}
                <div class="feedback" id="feedback"></div>
              `;

        document.querySelectorAll(".opt-btn").forEach((btn) => {
          btn.addEventListener("click", () => onAnswer(btn), { once: true });
        });
      }

      function onAnswer(btn) {
        const allBtns = document.querySelectorAll(".opt-btn");
        const isCorrect = btn.dataset.correct === "true";
        const feedback = document.getElementById("feedback");

        allBtns.forEach((b) => {
          b.disabled = true;
          if (b.dataset.correct === "true") b.classList.add("correct");
        });
        if (!isCorrect) btn.classList.add("wrong");

        if (isCorrect) {
          state.score++;
          playCorrectJingle();
          feedback.textContent = "Correct! Great job!";
          feedback.className = "feedback good";
        } else {
          playWrongSound();
          feedback.textContent = "Not quite! Try again next time.";
          feedback.className = "feedback bad";
        }

        setTimeout(() => {
          const bank = currentBank();
          if (state.qIndex < bank.length - 1) {
            state.qIndex++;
            render();
          } else {
            state.totalScore += state.score;
            state.totalQuestions += bank.length;
            state.screen = "quizDone";
            render();
          }
        }, 1100);
      }

      function renderQuizDone() {
        const meta = QUIZ_META[state.quizIndex];
        const bank = currentBank();
        const isLast = state.quizIndex === QUIZ_META.length - 1;

        app.innerHTML = `
                <span class="quiz-label">${meta.label}</span>
                <h2 class="section-title">Well done！</h2>
                <p class="center-text en" style="font-size:1.2rem;">
                  ${state.score} / ${bank.length} もん せいかい
                </p>
                <div class="btn-row">
                  <button class="btn btn-primary" id="nextBtn">
                    ${isLast ? "けっかを みる" : "つぎの クイズへ"}
                  </button>
                </div>
              `;

        document.getElementById("nextBtn").onclick = () => {
          if (isLast) {
            state.screen = "final";
          } else {
            state.quizIndex++;
            state.qIndex = 0;
            state.score = 0;
            state.screen = "quiz";
          }
          render();
        };
      }

      function renderFinal() {
        const pct = Math.round((state.totalScore / state.totalQuestions) * 100);
        let emoji = "🌟";
        let msg = "とても よく できました！";
        if (pct < 50) {
          emoji = "🌱";
          msg = "もういちど れんしゅうしよう。だんだん じょうずに なるよ！";
        } else if (pct < 80) {
          emoji = "🌿";
          msg =
            "よく がんばりました！つぎは もっと たかい てんすうを めざそう。";
        }
        playWinFanfare();
        app.innerHTML = `
                <div class="result-emoji">${emoji}</div>
                <div class="result-row">
                  <img src="../images/sh1.png" class="result-icon" alt="" />
                  <div class="result-score">${state.totalScore} / ${state.totalQuestions} てん（${pct}％）</div>
                  <img src="../images/kh1.png" class="result-icon" alt="" />
                </div>
                <p class="result-msg jp">${msg}</p>
                <div class="btn-row">
                  <button class="btn btn-primary" id="retryBtn">もういちど やる</button>
                </div>
              `;

        document.getElementById("retryBtn").onclick = () => {
          resetAll();
          render();
        };
      }

      /* ---------------- init ---------------- */
      resetAll();
      render();
    </script>
  </body>
</html>
