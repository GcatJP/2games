<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Unit 1a. Phonics | Adventure Island 2</title>

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      :root {
        --font-chalk:
          "Chalkboard SE", "Comic Sans MS", "Segoe Print", sans-serif;
        --font-jp:
          "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
        --green-bg: #4f7831;
        --green-panel: #ffffff;
        --yellow-btn: #ffd600;
        --yellow-btn-active: #ffc200;
        --heading: #ff8c1a;
        --correct: #38a446;
        --wrong: #e6483a;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        overflow-x: hidden;
      }

      body {
        font-family: var(--font-jp);
        background: var(--green-bg);
        background-image: radial-gradient(
          circle at 20% 10%,
          #5c8a3a 0%,
          #4f7831 55%
        );
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px 14px 60px;
      }

      h1.page-title {
        font-family: var(--font-chalk);
        color: #fff566;
        -webkit-text-stroke: 1.5px var(--heading);
        text-align: center;
        font-size: clamp(1.4rem, 6vw, 2.4rem);
        letter-spacing: 0.02em;
        margin-bottom: 18px;
      }
      .back-btn {
        position: fixed;
        top: 16px;
        left: 16px;
        font-family: var(--font-chalk);
        font-weight: 700;
        font-size: 0.95rem;
        color: #5a4200;
        background: var(--yellow-btn);
        border: 3px solid #333;
        border-radius: 999px;
        padding: 8px 16px;
        text-decoration: none;
        z-index: 10;
        box-shadow: 0 3px 0 #333;
        transition:
          transform 0.08s ease,
          background 0.15s ease;
      }

      .back-btn:active {
        transform: scale(0.96);
        background: var(--yellow-btn-active);
      }

      @media (max-width: 480px) {
        .back-btn {
          top: 10px;
          left: 10px;
          padding: 6px 12px;
          font-size: 0.85rem;
        }
      }
      #app {
        width: 100%;
        max-width: 640px;
        background: var(--green-panel);
        border-radius: 22px;
        border: 4px solid #2f4a1c;
        box-shadow:
          0 8px 0 #2f4a1c,
          0 14px 24px rgba(0, 0, 0, 0.25);
        padding: 22px 18px 26px;
      }

      .badge {
        display: inline-block;
        background: var(--heading);
        color: #fff;
        font-family: var(--font-chalk);
        font-size: 0.9rem;
        padding: 4px 14px;
        border-radius: 999px;
        margin-bottom: 10px;
      }

      h2.section-title {
        font-family: var(--font-chalk);
        color: var(--heading);
        font-size: clamp(1.2rem, 5vw, 1.7rem);
        margin-bottom: 14px;
        border-bottom: 3px dashed #ffe08a;
        padding-bottom: 8px;
      }

      p.jp {
        font-size: clamp(1rem, 4vw, 1.15rem);
        line-height: 1.9;
        color: #333;
        margin-bottom: 14px;
      }

      .en {
        color: #1e6fbf;
        font-family: var(--font-chalk);
        font-weight: 700;
      }

      /* --- alphabet cards --- */
      .letter-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
        gap: 12px;
        margin: 16px 0 22px;
      }

      .letter-card {
        border: 3px solid #333;
        border-radius: 14px;
        overflow: hidden;
        text-align: center;
        background: #fff;
      }

      .letter-big {
        font-family: var(--font-chalk);
        font-weight: 700;
        font-size: 2.3rem;
        line-height: 1.1;
        color: #333;
        padding: 10px 0 8px;
        background: #f4f8ee;
        border-bottom: 3px solid #333;
      }

      .letter-sound {
        margin: 8px auto;
      }

      .note-box {
        background: #eaf4ff;
        border: 3px dashed #6fb1ff;
        border-radius: 14px;
        padding: 12px 16px;
        margin-bottom: 18px;
      }

      .note-box .jp {
        margin-bottom: 0;
        font-size: 0.98rem;
      }

      /* --- buttons --- */
      .btn {
        font-family: var(--font-chalk);
        font-weight: 700;
        color: #5a4200;
        background: var(--yellow-btn);
        border: 3px solid #333;
        border-radius: 12px;
        cursor: pointer;
        padding: 12px 18px;
        font-size: clamp(1rem, 4.5vw, 1.2rem);
        width: 100%;
        display: block;
        text-align: center;
        transition:
          transform 0.08s ease,
          background 0.15s ease;
      }

      .btn:active {
        transform: scale(0.97);
        background: var(--yellow-btn-active);
      }

      .btn-primary {
        max-width: 260px;
        margin: 8px auto 0;
      }

      .btn-row {
        display: flex;
        justify-content: center;
        margin-top: 18px;
      }

      /* --- quiz screen --- */
      .progress {
        font-family: var(--font-chalk);
        color: #777;
        font-size: 0.95rem;
        margin-bottom: 10px;
      }

      .quiz-label {
        display: inline-block;
        font-family: var(--font-chalk);
        background: #eef7e2;
        color: #4a7a2a;
        border: 2px solid #4a7a2a;
        border-radius: 999px;
        padding: 3px 12px;
        font-size: 0.85rem;
        margin-bottom: 12px;
      }

      /* big play-sound button for the quiz */
      .big-speak-btn {
        display: block;
        margin: 0 auto 22px;
        width: 96px;
        height: 96px;
        border-radius: 50%;
        background: var(--heading);
        color: #fff;
        border: 4px solid #333;
        font-size: 2.6rem;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition:
          transform 0.08s ease,
          background 0.15s ease;
      }

      .big-speak-btn:active {
        transform: scale(0.92);
        background: #e67a00;
      }

      .question-jp {
        text-align: center;
        font-size: clamp(1.05rem, 4.5vw, 1.3rem);
        margin-bottom: 18px;
        color: #333;
      }

      .letter-options {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-bottom: 14px;
      }

      .opt-btn {
        font-family: var(--font-chalk);
        font-size: clamp(2rem, 10vw, 3rem);
        font-weight: 700;
        background: #fff;
        border: 3px solid #333;
        border-radius: 16px;
        padding: 22px 8px;
        cursor: pointer;
        color: #333;
        transition:
          transform 0.08s ease,
          background 0.15s ease;
      }

      .opt-btn:active {
        transform: scale(0.97);
      }

      .opt-btn.correct {
        background: var(--correct);
        color: #fff;
        border-color: #256b32;
      }

      .opt-btn.wrong {
        background: var(--wrong);
        color: #fff;
        border-color: #a12c22;
      }

      .opt-btn[disabled] {
        cursor: default;
      }

      .feedback {
        text-align: center;
        font-family: var(--font-chalk);
        font-size: 1.1rem;
        min-height: 1.6em;
        margin-bottom: 8px;
      }

      .feedback.good {
        color: var(--correct);
      }

      .feedback.bad {
        color: var(--wrong);
      }

      /* --- result screen --- */
      .result-emoji {
        font-size: 3.2rem;
        text-align: center;
        margin-bottom: 6px;
      }
      .result-icon {
        height: clamp(50px, 14vw, 90px);
        width: auto;
      }

      .result-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 6px;
      }
      .result-score {
        text-align: center;
        font-family: var(--font-chalk);
        font-size: 1.6rem;
        color: var(--heading);
        margin-bottom: 10px;
      }

      .result-msg {
        text-align: center;
        font-size: 1.1rem;
        color: #333;
        margin-bottom: 18px;
      }
    </style>
  </head>

  <body>
    <h1 class="page-title">Unit 1a：Phonics</h1>
    <a class="back-btn" href="index.html">← Back</a>
    <div id="app"></div>

    <script>
      /* ---------------- Phonics data: the 26 letter sounds ---------------- */
      // Your own recordings, one per letter: audio/a.m4a, audio/b.m4a, ... audio/z.m4a
      const AUDIO_PATH = "../audio/"; // adjust if your audio folder lives somewhere else

      const LETTERS = [
        "a",
        "b",
        "c",
        "d",
        "e",
        "f",
        "g",
        "h",
        "i",
        "j",
        "k",
        "l",
        "m",
        "n",
        "o",
        "p",
        "q",
        "r",
        "s",
        "t",
        "u",
        "v",
        "w",
        "x",
        "y",
        "z",
      ];

      function playSound(letter) {
        const audio = new Audio(`${AUDIO_PATH}${letter}.m4a`);
        audio.play().catch(() => {});
        return audio;
      }

      /* ---------------- helpers ---------------- */
      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function sample(arr, n) {
        return shuffle(arr).slice(0, n);
      }

      /* ---------------- build the quiz ---------------- */
      // 12 of the 26 letters. Each question is the target letter + one random
      // other letter, shown in random left/right order.
      function buildQuiz() {
        return sample(LETTERS, 12).map((letter) => {
          const other = sample(
            LETTERS.filter((l) => l !== letter),
            1,
          )[0];
          return {
            letter,
            options: shuffle([letter, other]),
          };
        });
      }

      /* ---------------- state ---------------- */
      let state = {
        screen: "intro",
        qIndex: 0,
        score: 0,
        bank: [],
      };

      function resetAll() {
        state = {
          screen: "intro",
          qIndex: 0,
          score: 0,
          bank: buildQuiz(),
        };
      }

      /* ---------------- render ---------------- */
      const app = document.getElementById("app");

      function render() {
        if (state.screen === "intro") return renderIntro();
        if (state.screen === "quiz") return renderQuiz();
        if (state.screen === "final") return renderFinal();
      }

      function renderIntro() {
        const cards = LETTERS.map(
          (l) => `
               <div class="letter-card">
                  <div class="letter-big">${l}</div>
                  <button class="speak-btn letter-sound" data-letter="${l}" aria-label="Listen to ${l}">🔊</button>
                </div>`,
        ).join("");

        app.innerHTML = `

                <h2 class="section-title">フォニックスって なに？</h2>
                <p class="jp">
                  えいごの もじには、２つの「なまえ」が あります。
                  ひとつは <span class="en">アルファベットの なまえ</span>
                  （たとえば <span class="en">b</span> は「ビー」）。
                  もうひとつは、その もじが ことばの なかで だす
                  <span class="en">おと（サウンド）</span> です。
                </p>
                <p class="jp">
                  この「もじの おと」の ことを
                  <span class="en">フォニックス（phonics）</span> と いいます。
                  たとえば <span class="en">b</span> の フォニックスの おとは
                  「ブ」で、<span class="en">book（ほん）</span> や
                  <span class="en">bag（かばん）</span> の さいしょの おとと おなじです。
                </p>
                <div class="note-box">
                  <p class="jp">
                    💡 フォニックスを おぼえると、はじめて みる えいごの ことばも、
                    じぶんで よめるように なります。もじの「なまえ」ではなく、
                    もじの「おと」を きいて おぼえましょう。
                  </p>
                </div>
                <p class="jp">
                  したの カードを タップすると、それぞれの もじの
                  フォニックスの おとが きこえるよ！ 🔊
                </p>
                <div class="letter-grid">${cards}</div>

                <div class="btn-row">
                  <button class="btn btn-primary" id="startBtn">クイズを はじめる</button>
                </div>
              `;

        document.querySelectorAll(".letter-sound").forEach((btn) => {
          btn.addEventListener("click", () => playSound(btn.dataset.letter));
        });

        document.getElementById("startBtn").onclick = () => {
          state.screen = "quiz";
          state.qIndex = 0;
          state.score = 0;
          render();
        };
      }

      function renderQuiz() {
        const q = state.bank[state.qIndex];

        app.innerHTML = `
                <span class="quiz-label">Quiz： Listen and Choose</span>
                <div class="progress">Question ${state.qIndex + 1} / ${state.bank.length}</div>
                <p class="question-jp">おとを きいて、ただしい もじを えらぼう。</p>
                <button class="big-speak-btn" id="playBtn" aria-label="Play sound">🔊</button>
                <div class="letter-options" id="optionsWrap">
                  ${q.options
                    .map(
                      (opt) =>
                        `<button class="opt-btn" data-correct="${opt === q.letter}">${opt}</button>`,
                    )
                    .join("")}
                </div>
                <div class="feedback" id="feedback"></div>
              `;

        document
          .getElementById("playBtn")
          .addEventListener("click", () => playSound(q.letter));
        // play the sound as soon as the question appears
        setTimeout(() => playSound(q.letter), 300);

        document.querySelectorAll(".opt-btn").forEach((btn) => {
          btn.addEventListener("click", () => onAnswer(btn), { once: true });
        });
      }

      function onAnswer(btn) {
        const allBtns = document.querySelectorAll(".opt-btn");
        const isCorrect = btn.dataset.correct === "true";
        const feedback = document.getElementById("feedback");

        allBtns.forEach((b) => {
          b.disabled = true;
          if (b.dataset.correct === "true") b.classList.add("correct");
        });
        if (!isCorrect) btn.classList.add("wrong");

        if (isCorrect) {
          state.score++;
          feedback.textContent = "Correct! Great job!";
          feedback.className = "feedback good";
        } else {
          feedback.textContent = "Not quite! Try again next time.";
          feedback.className = "feedback bad";
        }

        setTimeout(() => {
          if (state.qIndex < state.bank.length - 1) {
            state.qIndex++;
            render();
          } else {
            state.screen = "final";
            render();
          }
        }, 1100);
      }

      function renderFinal() {
        const pct = Math.round((state.score / state.bank.length) * 100);
        let emoji = "🌟";
        let msg = "とても よく できました！";
        if (pct < 50) {
          emoji = "🌱";
          msg = "もういちど れんしゅうしよう。だんだん じょうずに なるよ！";
        } else if (pct < 80) {
          emoji = "🌿";
          msg =
            "よく がんばりました！つぎは もっと たかい てんすうを めざそう。";
        }
        app.innerHTML = `
                <div class="result-emoji">${emoji}</div>
                <div class="result-score">${state.score} / ${state.bank.length} てん（${pct}％）</div>
                <p class="result-msg jp">${msg}</p>
                <div class="btn-row">
                  <button class="btn btn-primary" id="retryBtn">もういちど やる</button>
                </div>
              `;

        document.getElementById("retryBtn").onclick = () => {
          resetAll();
          render();
        };
      }

      /* ---------------- init ---------------- */
      resetAll();
      render();
    </script>
  </body>
</html>
