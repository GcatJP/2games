<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Unit 9. What pet do you like? | Adventure Island 2</title>

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      :root {
        --font-chalk:
          "Chalkboard SE", "Comic Sans MS", "Segoe Print", sans-serif;
        --font-jp:
          "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
        --green-bg: #4f7831;
        --green-panel: #ffffff;
        --yellow-btn: #ffd600;
        --yellow-btn-active: #ffc200;
        --heading: #ff8c1a;
        --correct: #38a446;
        --wrong: #e6483a;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        overflow-x: hidden;
      }

      body {
        font-family: var(--font-jp);
        background: var(--green-bg);
        background-image: radial-gradient(
          circle at 20% 10%,
          #5c8a3a 0%,
          #4f7831 55%
        );
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px 14px 60px;
      }

      h1.page-title {
        font-family: var(--font-chalk);
        color: #fff566;
        -webkit-text-stroke: 1.5px var(--heading);
        text-align: center;
        font-size: clamp(1.4rem, 6vw, 2.4rem);
        letter-spacing: 0.02em;
        margin-bottom: 18px;
      }
      .back-btn {
        position: fixed;
        top: 16px;
        left: 16px;
        font-family: var(--font-chalk);
        font-weight: 700;
        font-size: 0.95rem;
        color: #5a4200;
        background: var(--yellow-btn);
        border: 3px solid #333;
        border-radius: 999px;
        padding: 8px 16px;
        text-decoration: none;
        z-index: 10;
        box-shadow: 0 3px 0 #333;
        transition:
          transform 0.08s ease,
          background 0.15s ease;
      }

      .back-btn:active {
        transform: scale(0.96);
        background: var(--yellow-btn-active);
      }

      @media (max-width: 480px) {
        .back-btn {
          top: 10px;
          left: 10px;
          padding: 6px 12px;
          font-size: 0.85rem;
        }
      }
      #app {
        width: 100%;
        max-width: 640px;
        background: var(--green-panel);
        border-radius: 22px;
        border: 4px solid #2f4a1c;
        box-shadow:
          0 8px 0 #2f4a1c,
          0 14px 24px rgba(0, 0, 0, 0.25);
        padding: 22px 18px 26px;
      }

      .badge {
        display: inline-block;
        background: var(--heading);
        color: #fff;
        font-family: var(--font-chalk);
        font-size: 0.9rem;
        padding: 4px 14px;
        border-radius: 999px;
        margin-bottom: 10px;
      }

      h2.section-title {
        font-family: var(--font-chalk);
        color: var(--heading);
        font-size: clamp(1.2rem, 5vw, 1.7rem);
        margin-bottom: 14px;
        border-bottom: 3px dashed #ffe08a;
        padding-bottom: 8px;
      }

      p.jp {
        font-size: clamp(1rem, 4vw, 1.15rem);
        line-height: 1.9;
        color: #333;
        margin-bottom: 14px;
      }

      .en {
        color: #1e6fbf;
        font-family: var(--font-chalk);
        font-weight: 700;
      }

      /* the plural "s" is always shown in red, like the textbook */
      .red-s {
        color: var(--wrong);
        font-family: var(--font-chalk);
        font-weight: 700;
      }

      /* category emoji in the last quiz */
      .cat-emoji {
        font-size: 3.2rem;
        line-height: 1;
      }

      /* --- vocab grid on explanation screen --- */
      .vocab-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 12px;
        margin: 16px 0 22px;
      }

      .vocab-card {
        border: 3px solid #333;
        border-radius: 14px;
        overflow: hidden;
        text-align: center;
        background: #fff;
      }

      .icon-box {
        height: 64px;
        border-bottom: 3px solid #333;
        background: #f4f8ee;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 6px;
      }

      .icon-box img,
      .quiz-icon img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      .vocab-card .label {
        padding: 6px 4px;
        line-height: 1.3;
      }

      .vocab-card .en-word {
        font-family: var(--font-chalk);
        font-weight: 700;
        color: #333;
        font-size: 1.05rem;
      }

      .vocab-card .jp-word {
        font-size: 0.85rem;
        color: #555;
      }

      /* --- 1 tiger / 2 tigers list on explanation screen --- */
      .plural-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 10px;
        margin: 14px 0 22px;
      }

      .plural-row {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }

      .plural-pill {
        flex: 1;
        font-family: var(--font-chalk);
        font-weight: 700;
        color: #333;
        background: #fff;
        border: 3px solid #333;
        border-radius: 12px;
        padding: 8px 6px;
        text-align: center;
        font-size: clamp(0.95rem, 4vw, 1.1rem);
      }

      .plural-row:active .plural-pill {
        background: #fff9db;
      }

      .pattern-box {
        background: #fff9db;
        border: 3px dashed #ffc200;
        border-radius: 14px;
        padding: 14px 16px;
        margin-bottom: 14px;
      }

      .pattern-box .line {
        font-family: var(--font-chalk);
        font-size: clamp(1rem, 4.5vw, 1.3rem);
        color: #333;
        margin: 4px 0;
      }

      .pattern-box .line .jp-sub {
        display: block;
        font-family: var(--font-jp);
        font-size: 0.85rem;
        color: #777;
        margin-top: 2px;
      }

      .note-box {
        background: #eaf4ff;
        border: 3px dashed #6fb1ff;
        border-radius: 14px;
        padding: 12px 16px;
        margin-bottom: 18px;
      }

      .note-box .jp {
        margin-bottom: 0;
        font-size: 0.98rem;
      }

      /* --- buttons --- */
      .btn {
        font-family: var(--font-chalk);
        font-weight: 700;
        color: #5a4200;
        background: var(--yellow-btn);
        border: 3px solid #333;
        border-radius: 12px;
        cursor: pointer;
        padding: 12px 18px;
        font-size: clamp(1rem, 4.5vw, 1.2rem);
        width: 100%;
        display: block;
        text-align: center;
        transition:
          transform 0.08s ease,
          background 0.15s ease;
      }

      .btn:active {
        transform: scale(0.97);
        background: var(--yellow-btn-active);
      }

      .btn-primary {
        max-width: 260px;
        margin: 8px auto 0;
      }

      .btn-row {
        display: flex;
        justify-content: center;
        margin-top: 18px;
      }

      /* --- quiz screens --- */
      .progress {
        font-family: var(--font-chalk);
        color: #777;
        font-size: 0.95rem;
        margin-bottom: 10px;
      }

      .quiz-icon {
        width: 140px;
        height: 110px;
        margin: 0 auto 16px;
        border: 4px solid #333;
        border-radius: 16px;
        background: #f4f8ee;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px;
      }

      .quiz-icon svg {
        width: 100%;
        height: 100%;
      }

      /* several copies of the same animal (for counting) */
      .quiz-icon.multi {
        width: fit-content;
        min-width: 140px;
        max-width: 100%;
        height: auto;
        min-height: 110px;
        flex-wrap: wrap;
        gap: 6px 10px;
      }

      .quiz-icon.multi img {
        height: clamp(44px, 12vw, 60px);
        width: auto;
        max-height: none;
      }

      .question-jp {
        text-align: center;
        font-size: clamp(1.05rem, 4.5vw, 1.3rem);
        margin-bottom: 4px;
        color: #333;
      }

      .question-jp.spaced {
        margin-bottom: 18px;
      }

      .question-en {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-family: var(--font-chalk);
        color: var(--heading);
        font-size: clamp(1.3rem, 5.5vw, 1.8rem);
        margin-bottom: 18px;
      }

      .speak-btn {
        background: var(--heading);
        color: #fff;
        border: none;
        border-radius: 50%;
        width: clamp(30px, 7vw, 38px);
        height: clamp(30px, 7vw, 38px);
        font-size: clamp(0.9rem, 3.5vw, 1.1rem);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
        padding: 0;
        transition:
          transform 0.08s ease,
          background 0.15s ease;
      }

      .speak-btn:active {
        transform: scale(0.88);
        background: #e67a00;
      }

      .options {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 14px;
      }

      @media (max-width: 420px) {
        .options {
          grid-template-columns: 1fr;
        }
      }

      .opt-btn {
        font-family: var(--font-chalk);
        font-size: clamp(0.95rem, 4vw, 1.15rem);
        font-weight: 700;
        background: #fff;
        border: 3px solid #333;
        border-radius: 12px;
        padding: 14px 8px;
        cursor: pointer;
        color: #333;
        transition:
          transform 0.08s ease,
          background 0.15s ease;
      }

      .opt-btn:active {
        transform: scale(0.97);
      }

      .opt-btn.correct {
        background: var(--correct);
        color: #fff;
        border-color: #256b32;
      }

      .opt-btn.wrong {
        background: var(--wrong);
        color: #fff;
        border-color: #a12c22;
      }

      .opt-btn[disabled] {
        cursor: default;
      }

      .feedback {
        text-align: center;
        font-family: var(--font-chalk);
        font-size: 1.1rem;
        min-height: 1.6em;
        margin-bottom: 8px;
      }

      .feedback.good {
        color: var(--correct);
      }

      .feedback.bad {
        color: var(--wrong);
      }

      /* --- result screen --- */
      .result-emoji {
        font-size: 3.2rem;
        text-align: center;
        margin-bottom: 6px;
      }
      .result-icon {
        height: clamp(50px, 14vw, 90px);
        width: auto;
      }

      .result-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 6px;
      }
      .result-score {
        text-align: center;
        font-family: var(--font-chalk);
        font-size: 1.6rem;
        color: var(--heading);
        margin-bottom: 10px;
      }

      .result-msg {
        text-align: center;
        font-size: 1.1rem;
        color: #333;
        margin-bottom: 18px;
      }

      .center-text {
        text-align: center;
      }

      .quiz-label {
        display: inline-block;
        font-family: var(--font-chalk);
        background: #eef7e2;
        color: #4a7a2a;
        border: 2px solid #4a7a2a;
        border-radius: 999px;
        padding: 3px 12px;
        font-size: 0.85rem;
        margin-bottom: 12px;
      }
    </style>
  </head>

  <body>
    <h1 class="page-title">Unit 9：What pet do you like?</h1>
    <a class="back-btn" href="index.html">← Back</a>
    <div id="app"></div>
    <script src="review.js"></script>

    <script>
      /* ---------------- Unit 9 data: pets ---------------- */
      const IMG_PATH = "../images/"; // adjust if your images live somewhere else

      function iconSvg(key) {
        return `<img src="${IMG_PATH}${key}.png" alt="${key}" />`;
      }

      // The image file for each pet is IMG_PATH + key + ".png"
      // suffix = what we add to make the plural ("s", or "" for fish)
      const ITEMS = [
        { art: "a", word: "cat", suffix: "s", jp: "ねこ", key: "cat" },
        { art: "a", word: "dog", suffix: "s", jp: "いぬ", key: "dog" },
        { art: "a", word: "fish", suffix: "", jp: "さかな", key: "fish" },
        { art: "a", word: "turtle", suffix: "s", jp: "かめ", key: "turtle" },
        {
          art: "a",
          word: "hamster",
          suffix: "s",
          jp: "ハムスター",
          key: "hamster",
        },
        { art: "a", word: "bird", suffix: "s", jp: "とり", key: "bird" },
        { art: "a", word: "rabbit", suffix: "s", jp: "うさぎ", key: "rabbit" },
        { art: "a", word: "bug", suffix: "s", jp: "むし", key: "bug" },
      ];

      // Quiz 3 categories: "What ___ do you like?" -> "I like ___."
      // (words from Units 2, 5, 6, 8 and 9; no pictures needed)
      const CATEGORIES = [
        {
          name: "pet",
          emoji: "🐾",
          answers: [
            "cats",
            "dogs",
            "fish",
            "turtles",
            "hamsters",
            "birds",
            "rabbits",
            "bugs",
          ],
        },
        {
          name: "fruit",
          emoji: "🍎",
          answers: [
            "apples",
            "pineapples",
            "oranges",
            "melons",
            "strawberries",
            "bananas",
            "peaches",
            "watermelons",
            "lemons",
            "cherries",
            "grapes",
            "kiwis",
          ],
        },
        {
          name: "color",
          emoji: "🎨",
          answers: [
            "red",
            "yellow",
            "pink",
            "green",
            "purple",
            "blue",
            "brown",
            "white",
            "black",
          ],
        },
        {
          name: "animal",
          emoji: "🦁",
          answers: [
            "tigers",
            "monkeys",
            "elephants",
            "zebras",
            "hippos",
            "bears",
            "giraffes",
            "alligators",
          ],
        },
        {
          name: "vegetable",
          emoji: "🥕",
          answers: [
            "carrots",
            "potatoes",
            "tomatoes",
            "cabbages",
            "onions",
            "cucumbers",
            "green peppers",
            "pumpkins",
          ],
        },
      ];

      /* ---------------- helpers ---------------- */
      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function sample(arr, n) {
        return shuffle(arr).slice(0, n);
      }

      // "a cat" / "a fish"
      function full(item) {
        return `${item.art} ${item.word}`;
      }

      // "cats" / "fish"
      function plural(item) {
        return item.word + item.suffix;
      }

      // "cat" + red "s"  (for the study screen); fish stays "fish"
      function pluralHtml(item) {
        if (item.suffix === "") {
          return `${item.word} <span class="red-s" style="font-size:0.7em;">そのまま</span>`;
        }
        return `${item.word}<span class="red-s">${item.suffix}</span>`;
      }

      // n copies of the same pet picture
      function iconsHtml(key, n) {
        if (n === 1) return `<div class="quiz-icon">${iconSvg(key)}</div>`;
        return `<div class="quiz-icon multi">${iconSvg(key).repeat(n)}</div>`;
      }

      function speakText(text) {
        if (!("speechSynthesis" in window)) return;
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = "en-US";
        utter.rate = 0.85;
        window.speechSynthesis.speak(utter);
      }
      function speakPattern(el) {
        const lines = [...el.querySelectorAll(".line")].map((line) => {
          const clone = line.cloneNode(true);
          clone.querySelector(".jp-sub")?.remove();
          return clone.textContent.trim();
        });
        speakText(lines.join(". "));
      }
      /* ---- audio ---- */
      let audioCtx = null;
      function getCtx() {
        if (!audioCtx)
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        return audioCtx;
      }
      function playTone(freq, startTime, duration, gainPeak) {
        const ctx = getCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(ctx.destination);
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(gainPeak, startTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
        osc.start(startTime);
        osc.stop(startTime + duration + 0.02);
      }
      function playCorrectJingle() {
        const ctx = getCtx(),
          now = ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) =>
          playTone(f, now + i * 0.09, 0.22, 0.22),
        );
      }
      function playWrongSound() {
        const ctx = getCtx(),
          now = ctx.currentTime;
        playTone(220, now, 0.18, 0.12);
        playTone(196, now + 0.08, 0.18, 0.1);
      }
      function playWinFanfare() {
        const ctx = getCtx(),
          now = ctx.currentTime;
        [523.25, 523.25, 659.25, 783.99, 1046.5, 1318.51].forEach((f, i) =>
          playTone(f, now + [0, 0.15, 0.3, 0.45, 0.6, 0.8][i], 0.3, 0.22),
        );
      }
      /* ---------------- build question banks (per session, so they re-shuffle every visit) ---------------- */
      function buildVocabQuiz() {
        // Show one pet icon, choose the correct English word (with a). 6 of 8 items.
        return sample(ITEMS, 6).map((item) => {
          const distractors = sample(
            ITEMS.filter((x) => x.word !== item.word),
            3,
          );
          const options = shuffle([item, ...distractors]);
          return {
            type: "vocab",
            iconKey: item.key,
            correctEn: full(item),
            options: options.map((o) => full(o)),
          };
        });
      }

      function buildLikeQuiz() {
        // Show 2 pets + "What pet do you like?" -> choose the correct "I like ___." 6 of 8 items.
        // One wrong option is the right pet with the wrong plural
        // (e.g. "I like cat." or "I like fishes."), the others are different pets.
        return sample(ITEMS, 6).map((item) => {
          const distractors = sample(
            ITEMS.filter((x) => x.word !== item.word),
            2,
          );
          const correct = `I like ${plural(item)}.`;
          const wrongWord = item.suffix === "" ? item.word + "es" : item.word;
          const wrong = `I like ${wrongWord}.`;
          const options = shuffle([
            correct,
            wrong,
            ...distractors.map((d) => `I like ${plural(d)}.`),
          ]);
          return {
            type: "like",
            iconKey: item.key,
            options,
            correctFull: correct,
          };
        });
      }

      function buildCategoryQuiz() {
        // "What fruit do you like?" -> the one answer that matches the category.
        // 6 questions: all 5 categories once, plus one extra. The 3 wrong answers
        // come from 3 different other categories.
        const cats = shuffle([
          ...CATEGORIES,
          CATEGORIES[Math.floor(Math.random() * CATEGORIES.length)],
        ]);
        return cats.map((cat) => {
          const pick = (c) =>
            c.answers[Math.floor(Math.random() * c.answers.length)];
          const correct = `I like ${pick(cat)}.`;
          // pets are animals too, so keep them out of the wrong answers for "animal"
          const others = sample(
            CATEGORIES.filter(
              (c) =>
                c.name !== cat.name &&
                !(cat.name === "animal" && c.name === "pet"),
            ),
            3,
          );
          const options = shuffle([
            correct,
            ...others.map((c) => `I like ${pick(c)}.`),
          ]);
          return {
            type: "category",
            emoji: cat.emoji,
            questionEn: `What ${cat.name} do you like?`,
            options,
            correctFull: correct,
          };
        });
      }

      /* ---------------- state ---------------- */
      let state = {
        screen: "intro",
        quizIndex: 0,
        qIndex: 0,
        score: 0,
        totalScore: 0,
        totalQuestions: 0,
        banks: [],
      };

      const QUIZ_META = [
        {
          key: "vocab",
          label: "Quiz １： Words",
          build: buildVocabQuiz,
        },
        {
          key: "like",
          label: "Quiz 2 ： Sentences",
          build: buildLikeQuiz,
        },
        {
          key: "category",
          label: "Quiz 3 ： Practice",
          build: buildCategoryQuiz,
        },
      ];

      function resetAll() {
        Review.reset();
        state = {
          screen: "intro",
          quizIndex: 0,
          qIndex: 0,
          score: 0,
          totalScore: 0,
          totalQuestions: 0,
          banks: QUIZ_META.map((m) => m.build()),
        };
      }

      /* ---------------- render ---------------- */
      const app = document.getElementById("app");

      function render() {
        if (state.screen === "intro") return renderIntro();
        if (state.screen === "quiz") return renderQuiz();
        if (state.screen === "quizDone") return renderQuizDone();
        if (state.screen === "final") return renderFinal();
      }

      function renderIntro() {
        const vocabCards = ITEMS.map(
          (item) => `
               <div class="vocab-card" data-word="${full(item)}">
                  <div class="icon-box">${iconSvg(item.key)}</div>
                  <div class="label">
                    <div class="en-word">${full(item)}</div>

                  </div>
                </div>`,
        ).join("");

        const pluralRows = ITEMS.map(
          (item) => `
               <div class="plural-row" data-say="${full(item)}. ${plural(item)}.">
                  <div class="plural-pill">${full(item)}</div>
                  <div class="plural-pill">${pluralHtml(item)}</div>
                </div>`,
        ).join("");

        app.innerHTML = `

                <h2 class="section-title">ペットの べんきょう</h2>
                <p class="jp">
                  きょうは <span class="en">pets（ペット）</span> の なまえを べんきょうします。<br>
                  したの カードを みて、ことばを おぼえましょう。
                </p>
                <div class="vocab-grid">${vocabCards}</div>
                <p class="jp" style="margin-top:-6px;">
                 カードを タップすると、えいごの はつおんが きこえるよ！ 🔊
              </p>

                <h2 class="section-title">「〜が すき」と いうときは</h2>
                <p class="jp">
                  「〜が すき」と いうときは、ペットの ことばを
                  <span class="red-s">s</span> の かたちに します。
                </p>
                <div class="plural-grid">${pluralRows}</div>
                <div class="note-box">
                  <p class="jp">
                    💡 <span class="en">fish</span> は かたちが かわりません。
                    <span class="en">I like fish.</span> と いいます。
                  </p>
                </div>

                <div class="pattern-box">
                  <p class="jp" style="margin-bottom:10px;">
                    「どの ペットが すき？」と きくときは、こう いいます。
                  </p>
                  <div class="line">
                    "What pet do you like?"
                    <span class="jp-sub">→ なんの ペットが すきですか？</span>
                  </div>
                  <div class="line">
                    "I like bugs."
                    <span class="jp-sub">→ むしが すきです。</span>
                  </div>
                </div>

                <div class="pattern-box">
                  <p class="jp" style="margin-bottom:10px;">
                    <span class="en">pet</span> の ところを かえると、
                    いろいろな ものを きくことが できます。
                  </p>
                  <div class="line">
                    "What fruit do you like?"
                    <span class="jp-sub">→ なんの くだものが すきですか？</span>
                  </div>
                  <div class="line">
                    "I like apples."
                    <span class="jp-sub">→ りんごが すきです。</span>
                  </div>
                  <div class="line">
                    "What color do you like?"
                    <span class="jp-sub">→ なんの いろが すきですか？</span>
                  </div>
                  <div class="line">
                    "I like red."
                    <span class="jp-sub">→ あかが すきです。</span>
                  </div>
                </div>

                <div class="note-box">
                  <p class="jp">
                    💡 <span class="en">animal</span>（どうぶつ）や
                    <span class="en">vegetable</span>（やさい）も おなじように きけるよ！
                  </p>
                </div>

                <p class="jp">
                  じゅんびは いいですか？ さいごに ３つの クイズに ちょうせんしましょう！
                </p>

                <div class="btn-row">
                  <button class="btn btn-primary" id="startBtn">クイズを はじめる</button>
                </div>
              `;
        document.getElementById("startBtn").onclick = () => {
          state.screen = "quiz";
          state.quizIndex = 0;
          state.qIndex = 0;
          state.score = 0;
          render();
        };
        document.querySelectorAll(".vocab-card").forEach((card) => {
          card.style.cursor = "pointer";
          card.addEventListener("click", () => speakText(card.dataset.word));
        });

        document.querySelectorAll(".plural-row").forEach((row) => {
          row.addEventListener("click", () => speakText(row.dataset.say));
        });

        document.querySelectorAll(".pattern-box").forEach((box) => {
          box.style.cursor = "pointer";
          box.addEventListener("click", () => speakPattern(box));
        });
      }
      function currentBank() {
        return state.banks[state.quizIndex];
      }

      function renderQuiz() {
        const meta = QUIZ_META[state.quizIndex];
        const bank = currentBank();
        const q = bank[state.qIndex];

        let bodyHtml = "";

        if (q.type === "vocab") {
          bodyHtml = `
                  <div class="quiz-icon">${iconSvg(q.iconKey)}</div>
               <p class="question-en">What's this?</p>
                  <div class="options" id="optionsWrap">
                    ${q.options
                      .map(
                        (opt) =>
                          `<button class="opt-btn" data-correct="${opt === q.correctEn}">${opt}</button>`,
                      )
                      .join("")}
                  </div>
                `;
        } else if (q.type === "like") {
          bodyHtml = `
                  ${iconsHtml(q.iconKey, 2)}
                  <p class="question-jp">Look at the pets. Choose the correct answer.</p>
                  <p class="question-en">
                    What pet do you like?
                    <button class="speak-btn" data-say="What pet do you like?" aria-label="Listen">🔊</button>
                  </p>
                  <div class="options" id="optionsWrap">
                    ${q.options
                      .map(
                        (opt) =>
                          `<button class="opt-btn" data-correct="${opt === q.correctFull}">${opt}</button>`,
                      )
                      .join("")}
                  </div>
                `;
        } else if (q.type === "category") {
          bodyHtml = `
                  <div class="quiz-icon"><span class="cat-emoji">${q.emoji}</span></div>
                  <p class="question-jp">Choose the correct answer.</p>
                  <p class="question-en">
                    ${q.questionEn}
                    <button class="speak-btn" data-say="${q.questionEn}" aria-label="Listen">🔊</button>
                  </p>
                  <div class="options" id="optionsWrap">
                    ${q.options
                      .map(
                        (opt) =>
                          `<button class="opt-btn" data-correct="${opt === q.correctFull}">${opt}</button>`,
                      )
                      .join("")}
                  </div>
                `;
        }

        app.innerHTML = `
                <span class="quiz-label">${meta.label}</span>
               <div class="progress">Question ${state.qIndex + 1} / ${bank.length}</div>
                ${bodyHtml}
                <div class="feedback" id="feedback"></div>
              `;

        document.querySelectorAll(".opt-btn").forEach((btn) => {
          btn.addEventListener("click", () => onAnswer(btn), { once: true });
        });

        document.querySelectorAll(".speak-btn").forEach((btn) => {
          btn.addEventListener("click", () => speakText(btn.dataset.say));
        });
      }

      function onAnswer(btn) {
        const allBtns = document.querySelectorAll(".opt-btn");
        const isCorrect = btn.dataset.correct === "true";
        const feedback = document.getElementById("feedback");

        allBtns.forEach((b) => {
          b.disabled = true;
          if (b.dataset.correct === "true") b.classList.add("correct");
        });
        if (!isCorrect) btn.classList.add("wrong");

        if (isCorrect) {
          state.score++;
          playCorrectJingle();
          feedback.textContent = "Correct! Great job!";
          feedback.className = "feedback good";
        } else {
          playWrongSound();
          Review.recordWrong(btn, QUIZ_META[state.quizIndex].label);
          feedback.textContent = "Not quite! Try again next time.";
          feedback.className = "feedback bad";
        }

        setTimeout(() => {
          const bank = currentBank();
          if (state.qIndex < bank.length - 1) {
            state.qIndex++;
            render();
          } else {
            state.totalScore += state.score;
            state.totalQuestions += bank.length;
            state.screen = "quizDone";
            render();
          }
        }, 1100);
      }

      function renderQuizDone() {
        const meta = QUIZ_META[state.quizIndex];
        const bank = currentBank();
        const isLast = state.quizIndex === QUIZ_META.length - 1;

        app.innerHTML = `
                <span class="quiz-label">${meta.label}</span>
                <h2 class="section-title">Well done！</h2>
                <p class="center-text en" style="font-size:1.2rem;">
                  ${state.score} / ${bank.length} もん せいかい
                </p>
                <div class="btn-row">
                  <button class="btn btn-primary" id="nextBtn">
                    ${isLast ? "けっかを みる" : "つぎの クイズへ"}
                  </button>
                </div>
              `;

        document.getElementById("nextBtn").onclick = () => {
          if (isLast) {
            state.screen = "final";
          } else {
            state.quizIndex++;
            state.qIndex = 0;
            state.score = 0;
            state.screen = "quiz";
          }
          render();
        };
      }

      function renderFinal() {
        const pct = Math.round((state.totalScore / state.totalQuestions) * 100);
        let emoji = "🌟";
        let msg = "とても よく できました！";
        if (pct < 50) {
          emoji = "🌱";
          msg = "もういちど れんしゅうしよう。だんだん じょうずに なるよ！";
        } else if (pct < 80) {
          emoji = "🌿";
          msg =
            "よく がんばりました！つぎは もっと たかい てんすうを めざそう。";
        }
        playWinFanfare();
        app.innerHTML = `
                <div class="result-emoji">${emoji}</div>
                <div class="result-row">
                  <img src="../images/sh1.png" class="result-icon" alt="" />
                  <div class="result-score">${state.totalScore} / ${state.totalQuestions} てん（${pct}％）</div>
                  <img src="../images/kh1.png" class="result-icon" alt="" />
                </div>
                <p class="result-msg jp">${msg}</p>
                ${Review.html()}
                <div class="btn-row">
                  <button class="btn btn-primary" id="retryBtn">もういちど やる</button>
                </div>
              `;

        document.getElementById("retryBtn").onclick = () => {
          resetAll();
          render();
        };
      }

      /* ---------------- init ---------------- */
      resetAll();
      render();
    </script>
  </body>
</html>
