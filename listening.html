<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0,
          maximum-scale=1.0, user-scalable=no"
    />

    <!-- iOS Home Screen behaviour -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Adventure Island" />

    <!-- App icons (multiple resolutions) -->
    <link rel="apple-touch-icon" sizes="180x180" href="images/Ai2.180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="images/Ai2.167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="images/Ai2.152.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="images/Ai2.120.png" />

    <link rel="manifest" href="manifest.json" />

    <title>Adventure Island 2 Listening</title>

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      :root {
        --font-chalk:
          "Chalkboard SE", "Comic Sans MS", "Segoe Print", sans-serif;
        --colour-btn-face: #ffd600;
        --colour-btn-active: #ffc200;
        --colour-btn-border: #000000;
        --colour-heading-text: orange;
        --colour-btn-green: #1c9406;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow-x: hidden;
        max-width: 100vw;
      }

      body {
        font-family: var(--font-chalk);
        background-color: #4f7831;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        transition: background 0.3s ease;
      }

      h1 {
        font-family: var(--font-chalk);
        color: var(--colour-heading-text);
        width: 100%;
        text-align: center;
        letter-spacing: 0.03em;
        flex-shrink: 0;
        -webkit-text-stroke: 2px yellow;
      }

      .grid-wrapper {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
      }

      .btn {
        font-family: var(--font-chalk);
        font-weight: bold;
        color: yellow;
        background: var(--colour-btn-green);
        border: 2px solid var(--colour-btn-border);
        border-radius: 10px;
        text-decoration: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        -webkit-text-stroke: 2px orange;
        transition:
          transform 0.1s ease,
          background 0.15s ease,
          color 0.15s ease;
      }

      .btn:active {
        transform: scale(0.97);
      }

      .back-btn {
        position: fixed;
        top: max(16px, env(safe-area-inset-top, 16px));
        left: max(16px, env(safe-area-inset-left, 16px));
        z-index: 60;
        display: flex;
        align-items: center;
        gap: 0.3em;
        background: var(--colour-btn-face);
        color: var(--colour-btn-border);
        border: 2px solid var(--colour-btn-border);
        border-radius: 999px;
        padding: 0.4em 0.9em;
        font-family: var(--font-chalk);
        font-weight: bold;
        font-size: 1rem;
        text-decoration: none;
        cursor: pointer;
        -webkit-text-stroke: 0;
        transition: transform 0.1s ease;
      }
      .back-btn:active {
        transform: translateY(2px);
        background: var(--colour-btn-active);
      }

      /* LANDSCAPE */
      @media screen and (orientation: landscape) {
        body {
          background-image: url("./images/bg-land2.png");
          background-size: cover;
          background-position: center center;
          background-repeat: no-repeat;
          overflow: hidden;
        }

        h1 {
          font-size: clamp(2rem, 6vw, 5rem);
          padding: 0.1em 0.5em;
          margin-top: 4vh;
        }

        .grid-wrapper {
          padding: 1vh 2vw 4vh;
        }

        .grid {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          grid-template-rows: repeat(2, auto);
          gap: clamp(8px, 2vw, 24px);
          width: min(94vw, 920px);
        }

        .btn {
          font-size: clamp(1rem, 4.5vw, 3.2rem);
          height: clamp(60px, 24vh, 150px);
        }
      }

      /* LANDSCAPE IPHONE */
      @media screen and (orientation: landscape) and (max-height: 450px) {
        body {
          width: 100vw !important;
          min-width: 100vw !important;
          overflow-x: hidden !important;
        }

        h1 {
          font-size: clamp(1rem, 6vw, 3rem) !important;
          padding: 0.1em 0.5em !important;
          margin-top: 1vh !important;
        }

        .grid-wrapper {
          padding: 1vh 6vw 2vh;
        }

        .btn {
          height: clamp(40px, 26vh, 90px) !important;
          font-size: clamp(0.9rem, 4vw, 2.4rem) !important;
        }
      }

      /* PORTRAIT */
      @media screen and (orientation: portrait) {
        body {
          overflow-y: auto;
          background-image: url("./images/bg-port2.png");
          background-size: cover;
          background-position: center center;
          background-repeat: no-repeat;
        }

        h1 {
          font-size: clamp(1.5rem, 10vw, 4rem);
          padding: 0.3em 0.5em;
          margin-top: 50px;
        }

        .grid-wrapper {
          padding: 2vw 9vw 24vw;
        }

        .grid {
          display: grid;
          grid-template-columns: repeat(2, 1fr);
          gap: clamp(14px, 5vw, 40px);
          width: 100%;
          max-width: 520px;
        }

        .btn {
          font-size: clamp(1rem, 7vw, 3rem);
          height: clamp(70px, 24vw, 200px);
        }
      }

      /* PORTRAIT IPHONE */
      @media screen and (orientation: portrait) and (max-width: 430px) {
        h1 {
          font-size: clamp(1.2rem, 9vw, 3rem) !important;
          padding: 0.3em 0.5em !important;
          margin-top: max(50px, env(safe-area-inset-top, 50px)) !important;
          -webkit-text-stroke: 1.5px yellow;
          line-height: 1.1;
        }

        .grid-wrapper {
          padding: 3vh 7vw 22vw !important;
        }

        .grid {
          gap: 18px !important;
        }

        .btn {
          height: clamp(70px, 26vw, 120px) !important;
          font-size: clamp(0.9rem, 6.5vw, 2.2rem) !important;
        }
      }
    </style>
  </head>

  <body>
    <a class="back-btn" href="index.html">← Back</a>
    <h1>Adventure Island 2 Listening</h1>

    <div class="grid-wrapper">
      <div class="grid" id="audio-grid">
        <a class="btn" href="listening-player.html?page=28">Page 28</a>
        <a class="btn" href="listening-player.html?page=31">Page 31</a>
        <a class="btn" href="listening-player.html?page=42">Test 1</a>
        <a class="btn" href="listening-player.html?page=52">Page 52</a>
        <a class="btn" href="listening-player.html?page=72">Page 72</a>
        <a class="btn" href="listening-player.html?page=78">Test 2</a>
      </div>
    </div>
  </body>
</html>
