<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0,
          maximum-scale=1.0, user-scalable=no"
    />

    <!-- iOS Home Screen behaviour -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Adventure Island" />

    <!-- App icons (multiple resolutions) -->
    <link rel="apple-touch-icon" href="../images/home2.png" />

    <link rel="manifest" href="manifest.json" />

    <title>Adventure Island 2</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap"
      rel="stylesheet"
    />

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      :root {
        --font-chalk:
          "Chalkboard SE", "Chalkboard", "Comic Neue", "Comic Sans MS", cursive;
        --colour-btn-face: #ffd600;
        --colour-btn-active: #ffc200;
        --colour-btn-border: #000000;
        --colour-heading-text: orange;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow-x: hidden;
        max-width: 100vw;
      }

      body {
        font-family: var(--font-chalk);
        /* Fallback gradient shows briefly before the background image loads */
        background: linear-gradient(to bottom, #bde55d, #4f7831);
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        transition: background 0.3s ease;
      }

      h1 {
        font-family: var(--font-chalk);
        color: var(--colour-heading-text);
        width: 100%;
        text-align: center;
        letter-spacing: 0.03em;
        flex-shrink: 0;
        -webkit-text-stroke: 2px yellow;
      }

      .grid-wrapper {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 0;
      }

      .btn {
        font-family: var(--font-chalk);
        font-weight: bold;
        color: yellow;
        background: var(--colour-btn-face);
        border: 2px solid var(--colour-btn-border);
        border-radius: 10px;
        text-decoration: none;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.3em;
        padding: 0.4em;
        width: 100%;
        -webkit-user-select: none;
        user-select: none;
        -webkit-text-stroke: 2px darkorange;
        transition:
          transform 0.1s ease,
          background 0.15s ease;
      }

      .btn-text {
        text-align: center;
        line-height: 1.05;
      }

      .btn-icon {
        height: 45%;
        width: auto;
        max-width: 60%;
        aspect-ratio: 1 / 1;
        flex-shrink: 1;
        min-width: 0;
        object-fit: contain;
        pointer-events: none;
        user-select: none;
      }
      .back-btn {
        position: fixed;
        top: max(16px, env(safe-area-inset-top, 16px));
        left: max(16px, env(safe-area-inset-left, 16px));
        z-index: 60;
        display: flex;
        align-items: center;
        gap: 0.3em;
        background: var(--colour-btn-face);
        color: var(--colour-btn-border);
        border: 2px solid var(--colour-btn-border);
        border-radius: 999px;
        padding: 0.4em 0.9em;
        font-family: var(--font-chalk);
        font-weight: bold;
        font-size: 1rem;
        text-decoration: none;
        cursor: pointer;
        -webkit-text-stroke: 0;
        transition: transform 0.1s ease;
      }
      .back-btn:active {
        transform: translateY(2px);
        background: var(--colour-btn-active);
      }
      /* LANDSCAPE */
      @media screen and (orientation: landscape) {
        body {
          background-image: url("./images/bg-land2.png");
          background-size: cover;
          background-position: center center;
          background-repeat: no-repeat;
          overflow: hidden;
        }

        h1 {
          font-size: clamp(1.6rem, 6vw, 5.5rem);
          padding: 0.1em 0.5em;
          margin-top: 4vh;
          margin-bottom: -6vh;
        }

        .grid-wrapper {
          padding: 1vh 2vw 2vh;
          margin-top: 2vh;
        }

        .grid {
          display: grid;
          grid-template-columns: repeat(2, 1fr);
          grid-template-rows: repeat(2, 1fr);
          gap: clamp(10px, 2vw, 24px);
          width: min(80vw, 800px);
          height: min(70vh, 460px);
        }

        .btn {
          font-size: clamp(1rem, 3.6vw, 2.6rem);
          height: 100%;
        }
      }

      /* LANDSCAPE IPHONE */
      @media screen and (orientation: landscape) and (max-height: 450px) {
        body {
          background-image: url("./images/bg-land2.png");
          background-size: cover;
          background-position: center center;
          background-repeat: no-repeat;
          width: 100vw !important;
          min-width: 100vw !important;
          overflow-x: hidden !important;
        }

        h1 {
          font-size: clamp(0.9rem, 6vw, 3.2rem) !important;
          padding: 0.1em 0.5em !important;
          margin-top: -2vh !important;
          margin-bottom: -6vh !important;
        }

        .grid-wrapper {
          padding: 1vh 3vw 2vh;
          margin-top: 1vh;
        }

        .grid {
          grid-template-columns: repeat(2, 1fr) !important;
          grid-template-rows: repeat(2, 1fr) !important;
          width: min(90vw, 500px) !important;
          height: min(80vh, 220px) !important;
          gap: clamp(6px, 1.5vw, 14px) !important;
        }

        .btn {
          height: 100% !important;
          font-size: clamp(0.6rem, 2.8vw, 1.5rem) !important;
        }
      }

      /* PORTRAIT */
      @media screen and (orientation: portrait) {
        body {
          overflow-y: auto;
          background-image: url("./images/bg-port2.png");
          background-size: cover;
          background-position: center center;
          background-repeat: no-repeat;
        }

        h1 {
          font-size: clamp(1.5rem, 12vw, 4rem);
          padding: 0.3em 0.5em;
          margin-top: 50px;
        }

        .grid-wrapper {
          padding: 2vw 9vw 6vw;
        }

        .grid {
          display: grid;
          grid-template-columns: 1fr;
          grid-template-rows: repeat(4, 1fr);
          gap: clamp(8px, 4vw, 30px);
          width: 100%;
          max-width: 520px;
        }

        .btn {
          font-size: clamp(0.85rem, 6.5vw, 2.6rem);
          height: clamp(70px, 18vw, 180px);
        }
      }
      /* PORTRAIT IPHONE */
      @media screen and (orientation: portrait) and (max-width: 430px) {
        h1 {
          font-size: clamp(1.2rem, 12vw, 4rem) !important;
          padding: 0.3em 0.5em !important;
          margin-top: max(50px, env(safe-area-inset-top, 50px)) !important;
          -webkit-text-stroke: 1.5px yellow;
          line-height: 1;
        }

        .grid-wrapper {
          padding: 2.5vh 9vw 2vw !important;
        }

        .grid {
          gap: 16px !important;
          width: 100% !important;
          margin-top: -3vh !important;
        }

        .btn {
          height: clamp(65px, 24vw, 150px) !important;
          font-size: clamp(0.75rem, 7vw, 2.2rem) !important;
        }
        .btn-text {
          text-align: center;
          line-height: 1.3;
        }
      }
      @media screen and (orientation: portrait) {
        .btn {
          flex-direction: row;
          justify-content: center;
          align-items: center;
          padding: 0.3em 0.8em;
        }

        .btn-text {
          flex: 1;
          text-align: center;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
          line-height: 1.3;
        }

        .btn-icon {
          display: none;
        }
      }
    </style>
  </head>

  <body>
    <a class="back-btn" href="index.html">← Back</a>
    <h1>Adventure Island 2</h1>
    <div class="grid-wrapper">
      <div class="grid" id="main-grid">
        <a
          class="btn"
          href="Match Up2/index.html"
          style="background-color: #1c9406"
        >
          <span class="btn-text">Match Up!</span>
          <img class="btn-icon" src="./images/km2.png" alt="" />
        </a>

        <a
          class="btn"
          href="Type Up2/index.html"
          style="background-color: #1c9406"
        >
          <span class="btn-text">Type Up!</span>
          <img class="btn-icon" src="./images/st2.png" alt="" />
        </a>

        <a
          class="btn"
          href="Word up2/index.html"
          style="background-color: #1c9406"
        >
          <span class="btn-text">Word Up!</span>
          <img class="btn-icon" src="./images/kw2.png" alt="" />
        </a>

        <a
          class="btn"
          href="Sentence Builder2/index.html"
          style="background-color: #1c9406"
        >
          <span class="btn-text">Sentence Builder</span>
          <img class="btn-icon" src="./images/sb2.png" alt="" />
        </a>
      </div>
    </div>
  </body>
</html>
